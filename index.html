<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EBR端末">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ERP一体型EBR 現場端末</title>
<style>
/* Layout: 左に筋書きガイド、中央に端末（スマホ／秤量PC）。スマホ幅では端末が全画面、ガイドは帯から開く */
:root{
  --navy:#1E2A4A; --navy2:#2A3A5E; --gold:#C2974A; --gold2:#A87E36;
  --pale:#F4F6FA; --pale2:#DCE4F2; --cream:#FBF4E6; --ink:#3A4256;
  --line:#D5DCE8; --mute:#6A7389; --white:#FFFFFF;
  --ok:#2C7A57; --okbg:#E5F2EB; --ng:#B3261E; --ngbg:#FBEAE8; --warn:#8A5D00; --warnbg:#FFF3D1;
  --font:Meiryo,"メイリオ","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--pale2);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ステージ */
.stage{min-height:100%;display:grid;grid-template-columns:340px 1fr;gap:32px;padding-block:28px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));align-items:start;max-width:1320px;margin:0 auto}
.devwrap{display:flex;justify-content:center;min-width:0}

/* ガイド */
.guide{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.guide h2{font-size:15px;color:var(--navy);margin:0 0 2px}
.guide .gsub{font-size:12px;color:var(--mute);margin:0 0 12px}
.gsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.gstep{border-radius:6px}
.gstep>button{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px;color:var(--ink)}
.gstep>button:hover{background:var(--pale)}
.gdot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--white)}
.gstep.done .gdot{background:var(--navy2);border-color:var(--navy2)}
.gstep.cur{background:var(--cream)}
.gstep.cur .gdot{border-color:var(--gold);background:var(--gold)}
.gstep .gl{font-size:13px}
.gstep .gjump{font-size:11px;color:var(--gold2);white-space:nowrap}
.gdetail{padding:4px 10px 10px 38px;font-size:12.5px}
.gdetail p{margin:0 0 6px}
.gdetail .gtry{background:var(--white);border:1px dashed var(--gold);border-radius:6px;padding:6px 8px;color:var(--ink)}
.gdetail .gtry b{color:var(--gold2)}
.gfoot{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.gfoot button{font-size:12px;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--mute)}

/* 端末 */
.dev{position:relative;width:390px;height:min(820px,calc(100vh - 56px));min-height:640px;background:var(--pale);border-radius:34px;border:10px solid #121A2E;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(30,42,74,.25)}
.dev.pc{width:min(960px,100%);height:min(680px,calc(100vh - 56px));border-radius:10px;border:0;border-top:28px solid #2B3245}
.proto{background:var(--cream);color:var(--gold2);font-size:11.5px;padding:3px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #EBDDBF;flex:none}
.proto b{letter-spacing:.06em}
.proto .gbtn{display:none;background:var(--gold);color:var(--white);border:0;border-radius:10px;font-size:11.5px;padding:1px 10px}
.hdr{background:var(--navy);color:var(--white);display:flex;align-items:center;gap:8px;padding:10px 12px;flex:none;min-height:54px}
.hdr .back{background:none;border:0;color:var(--white);font-size:20px;line-height:1;padding:4px 6px;border-radius:6px}
.hdr .back:hover{background:var(--navy2)}
.hdr .ttl{flex:1;min-width:0}
.hdr .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl span{display:block;font-size:11px;color:#B9C3DA}
.hdr .who{font-size:11px;text-align:right;color:#CFD7E8;line-height:1.35}
.content{flex:1;overflow:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px}
.actions{flex:none;background:var(--white);border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.actions .note{font-size:12px;color:var(--mute);text-align:center;margin:0}
.dev.pc .content{padding:16px 20px}
.dev.pc .actions{flex-direction:row;justify-content:flex-end}

/* 部品 */
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--navy)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}
.kv dt{color:var(--mute)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.eyebrow{font-size:11px;color:var(--mute);letter-spacing:.05em;margin:0}
.btn{border:0;border-radius:8px;padding:13px 14px;font-size:15px;font-weight:bold;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.dev.pc .btn{width:auto;min-width:200px}
.btn.scan{background:var(--navy);color:var(--white)}
.btn.scan:hover{background:var(--navy2)}
.btn.issue{background:var(--gold);color:var(--white)}
.btn.issue:hover{background:var(--gold2)}
.btn.pri{background:var(--navy2);color:var(--white)}
.btn.sec{background:var(--white);color:var(--navy);border:1px solid var(--line)}
.btn:disabled{background:#C9CFDB;color:#F4F6FA;cursor:not-allowed}
.link{background:none;border:0;color:var(--navy2);text-decoration:underline;padding:0;font-size:12.5px}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--pale2);color:var(--navy);white-space:nowrap;font-weight:normal}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.ng{background:var(--ngbg);color:var(--ng)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.gold{background:var(--cream);color:var(--gold2)}
.chip.navy{background:var(--navy);color:var(--white)}
.info{font-size:12px;color:var(--mute);background:var(--pale);border-radius:8px;padding:8px 10px;margin:0}
.flowmark{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px}
.fm{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 7px}
.fm.r{background:var(--navy);color:var(--white)}
.fm.i{background:var(--gold);color:var(--white)}

/* ホーム */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile .tn{font-size:12px;color:var(--mute)}
.tile .tt{font-size:14.5px;font-weight:bold;color:var(--navy);line-height:1.35}
.tile .tm{margin-top:auto;display:flex;gap:4px;flex-wrap:wrap}
.tile.next{border:2px solid var(--gold);background:var(--cream)}
.tile.done{background:#F7F9FC}
.tile.lock{opacity:.6}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:10px}

/* 一覧 */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%}
button.row:hover{border-color:var(--navy2)}
.row .r1{font-weight:bold;color:var(--navy);font-size:14px}
.row .r2{font-size:12px;color:var(--mute);grid-column:1}
.row .rr{grid-row:1/3;grid-column:2;text-align:right}
.row.dim{opacity:.55}
.checklist{display:flex;flex-direction:column;gap:6px}
.ck{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.ck .box{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--white);font-size:12px}
.ck.on{border-color:#B8D8C7}
.ck.on .box{background:var(--ok);border-color:var(--ok)}
.ck .s{font-size:11.5px;color:var(--mute)}

/* 読取ビュー */
.finder{background:#141B2D;border-radius:10px;height:150px;position:relative;display:grid;place-items:center;color:#9BA6C0;font-size:12px;overflow:hidden;flex:none}
.finder::before{content:"";position:absolute;width:120px;height:120px;border:2px solid rgba(255,255,255,.75);border-radius:10px}
.finder::after{content:"";position:absolute;left:calc(50% - 56px);width:112px;height:2px;background:var(--gold);top:30%;animation:sweep 2.2s ease-in-out infinite alternate}
@keyframes sweep{to{top:68%}}
@media (prefers-reduced-motion:reduce){.finder::after{animation:none;top:50%}}
.finder span{position:relative;z-index:1;margin-top:150px}

/* フォーム */
.fsec{display:flex;flex-direction:column;gap:8px}
.fsec h3{margin:4px 0 0;font-size:13px;color:var(--navy);display:flex;gap:6px;align-items:center}
.fld{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:1fr 128px;gap:2px 10px;align-items:center}
.fld label{font-size:13px}
.fld .spec{font-size:11px;color:var(--mute);grid-column:1}
.fld .in{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:4px}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:right;background:var(--white);min-width:0}
.fld input[type=text].l{text-align:left}
.fld .u{font-size:11.5px;color:var(--mute);white-space:nowrap}
.fld.bad{border-color:var(--ng);background:var(--ngbg)}
.fld.bad .spec{color:var(--ng)}
.fld.auto input{background:var(--pale);border-style:dashed}
.fld.wide{grid-template-columns:1fr}
.fld.wide .in{grid-row:auto;grid-column:1}
textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;min-height:64px;resize:vertical;background:var(--white)}
.chk{display:flex;gap:8px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.chk input{width:18px;height:18px;margin-top:2px;flex:none}
.alert{border-radius:8px;padding:9px 11px;font-size:12.5px;margin:0}
.alert.ng{background:var(--ngbg);color:var(--ng);border:1px solid #EFC4BF}
.alert.ok{background:var(--okbg);color:var(--ok);border:1px solid #BFDCCB}
.alert.warn{background:var(--warnbg);color:var(--warn);border:1px solid #F0DDA6}
.stamp{font-size:11px;color:var(--mute)}

/* ラベル */
.label{background:var(--white);border:1px solid #D9C7A2;border-radius:6px;overflow:hidden;box-shadow:0 2px 0 #EFE6D3}
.label .lh{background:var(--gold);color:var(--white);font-size:12px;font-weight:bold;padding:4px 10px;display:flex;justify-content:space-between}
.label .lb{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px;align-items:center}
.label .lb .kv{font-size:12px}
.issued{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.issued .big{width:56px;height:56px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;font-size:28px}
.issued b{font-size:16px;color:var(--navy)}

/* 秤量PC */
.pcgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;min-height:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--white)}
.tbl th{background:var(--navy);color:var(--white);font-weight:normal;text-align:left;padding:7px 9px;font-size:12px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:middle}
.tbl tr.sel td{background:var(--cream)}
.phgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.phimg{border:0;padding:0;background:var(--pale2);aspect-ratio:1;display:block;width:100%;max-width:100%}
.phimg img{width:100%;height:100%;object-fit:cover;display:block}
.phm{padding:5px 6px 6px;display:flex;flex-direction:column;gap:2px;font-size:11px;align-items:flex-start}
.ph.old{opacity:.5}
.phempty{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;font-size:12px;color:var(--mute);background:var(--white);margin:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
label.btn{cursor:pointer}
.viewer img{width:100%;border-radius:8px;display:block;background:var(--pale2)}
.tbl tr.pick{cursor:pointer}
.tbl td:first-child{white-space:nowrap}
.tbl tr.pick:hover td{background:var(--pale)}
.wbtn{background:var(--navy);color:var(--white);border:0;border-radius:6px;padding:6px 12px;font-size:12.5px;font-weight:bold;white-space:nowrap}
.wbtn:hover{background:var(--navy2)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.scale{background:#0F1626;color:#7CF0B1;border-radius:10px;padding:14px 16px;font-family:Consolas,"Courier New",monospace;text-align:right}
.scale .sv{font-size:42px;line-height:1.1;font-variant-numeric:tabular-nums}
.scale .sl{display:flex;justify-content:space-between;font-size:11px;color:#8A96B3;font-family:var(--font)}
.steps2{display:flex;gap:6px}
.steps2 span{flex:1;text-align:center;font-size:12px;padding:5px;border-radius:6px;background:var(--pale2);color:var(--mute)}
.steps2 span.on{background:var(--navy);color:var(--white)}
.steps2 span.dn{background:var(--okbg);color:var(--ok)}

/* トレース */
.tree{display:flex;flex-direction:column;gap:0}
.tnode{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;text-align:left;width:100%;display:flex;flex-direction:column;gap:3px}
button.tnode:hover{border-color:var(--navy2)}
.tnode .th{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tnode .th b{color:var(--navy);font-size:13.5px}
.tnode.none{opacity:.5;border-style:dashed}
.tlink{display:flex;align-items:center;gap:6px;padding:4px 0 4px 18px;font-size:11px;color:var(--mute);border-left:2px solid var(--gold);margin-left:18px}
.tkids{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpair{display:flex;flex-direction:column;gap:0}

/* 監査証跡 */
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--white)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--white);border-radius:14px;padding:3px 11px;font-size:12px;color:var(--ink)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:var(--white)}
.ev{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;text-align:left;width:100%;display:flex;flex-direction:column;gap:2px}
.ev .e1{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:11.5px}
.ev .e2{font-weight:bold;color:var(--navy);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev .e3{color:var(--ink)}
.ev .ex{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.ev.ngv{border-left:4px solid var(--ng)}
.ev.mod{border-left:4px solid var(--gold)}

/* 記録照会 */
.rv{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.rv .rs{font-size:11px;color:var(--mute)}
.rv .val{font-weight:bold;text-align:right}
.rv .hist{grid-column:1/-1;font-size:11.5px;color:var(--gold2);background:var(--cream);border-radius:6px;padding:4px 8px}

/* オーバーレイ */
.ovl{position:absolute;inset:0;background:rgba(18,26,46,.5);display:flex;align-items:flex-end;z-index:20}
.dev.pc .ovl{align-items:center;justify-content:center}
.sheet{background:var(--white);width:100%;border-radius:16px 16px 0 0;max-height:86%;display:flex;flex-direction:column}
.dev.pc .sheet{width:520px;border-radius:12px;max-height:90%}
.sheet .sh{padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.sheet .sh b{color:var(--navy);font-size:15px}
.sheet .sh p{margin:2px 0 0;font-size:11.5px;color:var(--mute)}
.sheet .sb{overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.sheet .sf{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet .sf .btn{flex:1}
.cand{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;width:100%}
.cand:hover{border-color:var(--navy)}
.cand .c1{font-weight:bold;color:var(--navy);font-size:13px}
.cand .c2{font-size:11.5px;color:var(--mute)}
.cand.used{opacity:.45}
.cand.hint{border:2px solid var(--gold)}
.mfield{display:flex;flex-direction:column;gap:4px;font-size:13px}
.mfield input,.mfield select{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--white)}
.mean{background:var(--pale);border-radius:8px;padding:8px 10px;font-size:12.5px}
.errscr{position:absolute;inset:0;background:var(--white);z-index:25;display:flex;flex-direction:column}
.errscr .eh{background:var(--ng);color:var(--white);padding:18px 16px 14px}
.errscr .eh b{font-size:18px;display:block}
.errscr .eh span{font-size:12px;opacity:.9}
.errscr .eb{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{border-radius:8px;padding:8px 10px;font-size:12.5px}
.cmp .rd{background:var(--ngbg);border:1px solid #EFC4BF}
.cmp .xp{background:var(--pale);border:1px solid var(--line)}
.cmp .t{font-size:11px;color:var(--mute)}
.toast{position:absolute;left:14px;right:14px;bottom:96px;background:var(--navy);color:var(--white);border-radius:10px;padding:10px 14px;font-size:13px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center}
.toast.ok::before{content:"✓";color:#8FE0B7;font-weight:bold}
.dev.pc .toast{left:auto;right:20px;width:380px;bottom:80px}

/* ガイド（スマホ） */
.gsheet{position:absolute;inset:0;z-index:40;background:rgba(18,26,46,.5);display:flex;align-items:flex-end}
.gsheet .guide{position:static;max-height:88%;width:100%;border-radius:16px 16px 0 0;border:0}

@media (max-width:1000px){
  .stage{grid-template-columns:1fr;padding:0;gap:0;height:100%}
  .stage>.guide{display:none}
  .devwrap{height:100%}
  .dev,.dev.pc{width:100%;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
  .dev.pc::before{display:none}
  .proto .gbtn{display:inline-block}
  .pcgrid{grid-template-columns:1fr}
  .hdr{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

<body>

<div id="app"></div>

<script>
(function(){
"use strict";

/* ===== マスタ（すべて架空） ===== */
const USERS={sato01:{name:"佐藤 一郎",role:"製造部"},suzuki02:{name:"鈴木 花子",role:"製造部（確認者）"}};
const ITEMS={
  A:{code:"M-1001",name:"主薬A",plan:10.000},
  B:{code:"M-2001",name:"賦形剤B",plan:8.400},
  C:{code:"M-3001",name:"崩壊剤C",plan:1.400},
  D:{code:"M-4001",name:"滑沢剤D",plan:0.200}
};
const KEYS=["A","B","C","D"];
const MO="MO-2611-001", PRODUCT="サンプル錠 100mg", BATCH="B2611-01";
const DSPEC=[
  {k:"mixT",sec:"混合",label:"混合時間",unit:"分",min:14,max:16,def:"15"},
  {k:"rpm",sec:"混合",label:"回転数",unit:"rpm",min:18,max:22,def:"20"},
  {k:"press",sec:"打錠",label:"打錠圧",unit:"kN",min:8,max:12,def:"10.2"},
  {k:"wt",sec:"打錠",label:"平均錠剤重量",unit:"mg",min:190,max:210,def:"200.4"},
  {k:"hard",sec:"打錠",label:"硬度",unit:"N",min:50,max:90,def:"68"},
  {k:"temp",sec:"作業環境",label:"室温",unit:"℃",min:15,max:25,def:"22.5"},
  {k:"hum",sec:"作業環境",label:"湿度",unit:"%RH",min:null,max:60,def:"45"},
  {k:"qty",sec:"出来高",label:"素錠 製造数",unit:"錠",min:95000,max:100000,def:"98500",spec:"理論 100,000錠／収率 95.0%以上"}
];
const ESPEC=[
  {k:"boxes",label:"出来高",unit:"箱",def:"980",spec:"100錠／箱（PTP 10錠×10シート）"},
  {k:"defect",label:"不良",unit:"錠",def:"300",spec:"外観不良・シール不良"},
  {k:"sample",label:"保存サンプル",unit:"錠",def:"200",spec:"参考品・保存品"},
  {k:"temp",label:"包装室 室温",unit:"℃",min:15,max:25,def:"23.0"},
  {k:"film",label:"PTPフィルム ロット",def:"PF-2610-118",text:true}
];

/* ===== 状態 ===== */
let S;
function fresh(){
  const t=new Date(2026,10,10,8,30);
  S={screen:"login",p:{},user:null,clock:t,f:{},audit:[],seq:0,
    lots:{},prog:{A:false,B:false,W:false,C:false,D:false,E:false,F:false},
    moved:{},wScan:{},weighed:{},cScan:{},eScan:false,fScan:false,
    rec:{},modal:null,sheet:null,err:null,toast:null,photos:[],phSeq:0,phPending:null,view:null,gopen:false,auditF:"all",auditQ:"",auditOpen:null,wSel:null,released:false};
  const L=(id,o)=>S.lots[id]=Object.assign({id,reads:[],parents:[]},o);
  L("R-2610-0412",{kind:"raw",key:"A",qty:"40.00 kg",exp:"2028-09-30",status:"合格",loc:"原料倉庫 A-01",issued:{step:"①受入",at:"10/14 10:12",by:"田中 健"}});
  L("R-2609-0188",{kind:"raw",key:"B",qty:"60.00 kg",exp:"2029-03-31",status:"合格",loc:"原料倉庫 A-04",issued:{step:"①受入",at:"9/22 14:40",by:"田中 健"}});
  L("R-2411-0077",{kind:"raw",key:"B",qty:"3.20 kg",exp:"2026-10-31",status:"合格",loc:"原料倉庫 A-05",issued:{step:"①受入",at:"2024/11/18",by:"田中 健"}});
  L("R-2610-0255",{kind:"raw",key:"C",qty:"12.00 kg",exp:"2028-12-31",status:"合格",loc:"原料倉庫 B-02",issued:{step:"①受入",at:"10/20 09:05",by:"田中 健"}});
  L("R-2608-0102",{kind:"raw",key:"D",qty:"2.50 kg",exp:"2028-06-30",status:"合格",loc:"原料倉庫 B-07",issued:{step:"①受入",at:"8/28 15:30",by:"田中 健"}});
  // 照合エラーを見せるための別ラベル
  L("W-2610-0233",{kind:"weighed",key:"A",qty:"5.000 kg",status:"秤量済",mo:"MO-2610-004",issued:{step:"④秤量",at:"10/30 09:41",by:"佐藤 一郎"}});
  L("B2610-04",{kind:"bulk",name:"サンプル錠 50mg 素錠",qty:"49,200 錠",status:"記録確定",mo:"MO-2610-004",issued:{step:"⑥製剤完了",at:"10/31 16:02",by:"佐藤 一郎"}});
  L("B2611-02",{kind:"bulk",name:"サンプル錠 100mg 素錠",qty:"—",status:"記録確定前",mo:"MO-2611-002",issued:null});
  L("P2610-03",{kind:"product",name:PRODUCT,qty:"500 箱",status:"合格",issued:{step:"⑦包装",at:"10/28 15:20",by:"佐藤 一郎"}});
}
fresh();

/* ===== ユーティリティ ===== */
const pad=n=>String(n).padStart(2,"0");
const tm=d=>`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const tmFull=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const tick=(m)=>{S.clock=new Date(S.clock.getTime()+m*60000+((S.seq*17)%50)*1000)};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n0=v=>Number(v).toLocaleString("ja-JP");
const uname=id=>USERS[id]?USERS[id].name:id;
const lotName=l=>l.kind==="raw"?ITEMS[l.key].name:l.kind==="weighed"?ITEMS[l.key].name+"（秤量済）":l.name;
const term=()=>S.screen.startsWith("W")?"秤量PC-01":"スマホ-03";
function log(action,target,detail,o){
  S.seq++;
  S.audit.unshift(Object.assign({id:S.seq,at:tmFull(S.clock),user:S.user?uname(S.user):"—",term:term(),action,target,detail},o||{}));
}
function stepOfScreen(){const s=S.screen;return s.startsWith("W")?"③④秤量":s.startsWith("A")?"①受入":s.startsWith("B")?"②移動":s.startsWith("C")?"⑤投入":s.startsWith("D")?"⑥製剤完了":s.startsWith("E")?"⑦包装":s.startsWith("F")?"⑧出荷":"—"}
function readLot(id){S.lots[id].reads.push({step:stepOfScreen(),at:tm(S.clock),by:uname(S.user)})}

/* 疑似QR（見た目のみ） */
function qr(seed,size){
  size=size||72;let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
  const n=21,u=size/n;let r="";
  const fin=(x,y)=>`<rect x="${x*u}" y="${y*u}" width="${7*u}" height="${7*u}" fill="#1E2A4A"/><rect x="${(x+1)*u}" y="${(y+1)*u}" width="${5*u}" height="${5*u}" fill="#fff"/><rect x="${(x+2)*u}" y="${(y+2)*u}" width="${3*u}" height="${3*u}" fill="#1E2A4A"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;
    h=(h*1103515245+12345)>>>0;if((h>>16)&1)r+=`<rect x="${x*u}" y="${y*u}" width="${u+.2}" height="${u+.2}" fill="#1E2A4A"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><rect width="${size}" height="${size}" fill="#fff"/>${fin(0,0)}${fin(14,0)}${fin(0,14)}${r}</svg>`;
}

/* ===== 業務処理（画面操作と「この工程から始める」で共用） ===== */
const core={
  receive(){
    const v=S.f;
    S.lots["R-2611-0031"]={id:"R-2611-0031",kind:"raw",key:"A",qty:(v.a_qty||"25.00")+" kg",exp:v.a_exp||"2028-10-31",status:"判定前",loc:v.a_loc||"原料倉庫 A-03",sup:v.a_sup||"SUP-A-24117",cont:v.a_cont||"5",reads:[],parents:[],issued:null};
    const ph=S.photos.filter(p=>!p.replaced);S.photos.forEach(p=>p.lot="R-2611-0031");
    log("受入登録","R-2611-0031 主薬A",`入荷予定 PO-2611-0021／数量 ${(v.a_qty||"25.00")} kg／容器 ${(v.a_cont||"5")}／使用期限 ${(v.a_exp||"2028-10-31")}／状態 品質判定前`+(ph.length?`／写真 ${ph.length}枚（${ph.map(p=>p.id).join("、")}）`:""),{sign:"実施"});
    tick(3);
  },
  issueRaw(){
    S.lots["R-2611-0031"].issued={step:"①受入",at:tm(S.clock),by:uname(S.user)};
    log("ラベル発行","R-2611-0031 主薬A",`原料ラベル ${S.lots["R-2611-0031"].cont}枚`);
    S.prog.A=true;tick(6);
  },
  scanMove(id){const l=S.lots[id];S.moved[l.key]=id;readLot(id);log("QR照合 OK",`${id} ${lotName(l)}`,"移動指示 MV-2611-014 と一致",{res:"OK"});tick(1)},
  move(){
    KEYS.forEach(k=>{S.lots[S.moved[k]].loc="秤量室"});
    log("移動実績登録","MV-2611-014",`原料倉庫 → 秤量室／${KEYS.map(k=>S.moved[k]).join("、")}`,{sign:"実施"});
    S.prog.B=true;tick(12);
  },
  scanW(k,id){S.wScan[k]=id;readLot(id);log("QR照合 OK（秤量前）",`${id} ${ITEMS[k].name}`,`製造指図 ${MO} の ${ITEMS[k].name} と一致`,{res:"OK"});tick(1)},
  weigh(k){
    const off=[0.002,-0.006,0.001,0.000][KEYS.indexOf(k)];
    const val=(ITEMS[k].plan+off).toFixed(3);
    const wid="W-2611-00"+(11+KEYS.indexOf(k));
    S.weighed[k]={wid,val};
    S.lots[wid]={id:wid,kind:"weighed",key:k,qty:val+" kg",status:"秤量済",mo:MO,reads:[],parents:[S.wScan[k]],issued:null};
    log("秤量実績登録",`${ITEMS[k].name}`,`指図量 ${ITEMS[k].plan.toFixed(3)} kg／秤量値 ${val} kg（秤から取込）／原料ロット ${S.wScan[k]}`,{sign:"実施"});
    tick(1);
    S.lots[wid].issued={step:"④秤量",at:tm(S.clock),by:uname(S.user)};
    log("ラベル発行",`${wid} ${ITEMS[k].name}`,"秤量済ラベル 1枚");
    tick(5);
    if(KEYS.every(x=>S.weighed[x]))S.prog.W=true;
  },
  scanC(id){const l=S.lots[id];S.cScan[l.key]=id;readLot(id);log("QR照合 OK（投入）",`${id} ${lotName(l)}`,`製造指図 ${MO} と一致`,{res:"OK"});tick(2)},
  charge(){
    S.rec.D={start:tm(S.clock)};
    log("投入確定",MO,`秤量済 ${KEYS.map(k=>S.weighed[k].wid).join("、")} を投入`,{sign:"実施"});
    S.prog.C=true;tick(95);
  },
  recD(conf){
    const vals={};DSPEC.forEach(s=>vals[s.k]=S.f["d_"+s.k]!=null?S.f["d_"+s.k]:s.def);
    Object.assign(S.rec.D,{vals,dev:!!dFails().length,memo:S.f.d_memo||"",worker:S.user,wAt:tm(S.clock),conf,cAt:null,end:tm(S.clock),hist:[],reconf:false});
    log("主要製造記録 確定",`${BATCH} 製剤（混合・打錠）`,DSPEC.map(s=>`${s.label} ${vals[s.k]}${s.unit}`).join("／")+(S.rec.D.dev?`／逸脱メモ：${S.rec.D.memo}`:""),{sign:"実施"});
    tick(2);S.rec.D.cAt=tm(S.clock);
    log("電子署名（確認）",`${BATCH} 製剤記録`,"確認者による確認",{sign:"確認",user:uname(conf)});
    tick(2);
  },
  issueBulk(){
    const q=S.rec.D.vals.qty;
    S.lots[BATCH]={id:BATCH,kind:"bulk",name:"サンプル錠 100mg 素錠",qty:n0(q)+" 錠",status:"記録確定",mo:MO,reads:[],parents:KEYS.map(k=>S.weighed[k].wid),issued:{step:"⑥製剤完了",at:tm(S.clock),by:uname(S.user)}};
    log("ラベル発行",`${BATCH} 素錠`,"バルクラベル 1枚");
    S.prog.D=true;tick(25);
  },
  scanE(){S.eScan=true;readLot(BATCH);log("QR照合 OK（包装投入）",`${BATCH} 素錠`,"包装指図 PK-2611-001 と一致",{res:"OK"});tick(3)},
  recE(conf){
    const vals={};ESPEC.forEach(s=>vals[s.k]=S.f["e_"+s.k]!=null?S.f["e_"+s.k]:s.def);
    const b=eBalance();
    S.rec.E={vals,input:b.input,diff:b.diff,dev:b.diff!==0||eFails().length>0,memo:S.f.e_memo||"",worker:S.user,wAt:tm(S.clock),conf,hist:[],reconf:false,start:tm(S.clock)};
    log("主要製造記録 確定","P2611-01 包装",`投入 ${n0(b.input)}錠／出来高 ${vals.boxes}箱／不良 ${vals.defect}錠／サンプル ${vals.sample}錠／収支差 ${b.diff}錠`,{sign:"実施"});
    tick(2);S.rec.E.cAt=tm(S.clock);
    log("電子署名（確認）","P2611-01 包装記録","確認者による確認",{sign:"確認",user:uname(conf)});
    tick(2);
  },
  issueProduct(){
    S.lots["P2611-01"]={id:"P2611-01",kind:"product",name:PRODUCT,qty:n0(S.rec.E.vals.boxes)+" 箱",status:"出荷判定前",reads:[],parents:[BATCH],issued:{step:"⑦包装",at:tm(S.clock),by:uname(S.user)}};
    log("ラベル発行","P2611-01 "+PRODUCT,`製品ラベル（ケース）${Math.ceil(S.rec.E.vals.boxes/10)}枚`);
    S.prog.E=true;tick(60*24);
  },
  release(){S.lots["P2611-01"].status="合格";S.released=true;log("出荷判定（デモ操作）","P2611-01","品質保証による出荷判定を模擬（本プロトタイプの範囲外）",{user:"品質保証（デモ）"});tick(30)},
  scanF(){S.fScan=true;readLot("P2611-01");log("QR照合 OK（出荷）","P2611-01 "+PRODUCT,"出荷指示 SH-2611-007 と一致",{res:"OK"});tick(5)},
  ship(){log("出荷登録","SH-2611-007",`P2611-01 ${PRODUCT} ${S.lots["P2611-01"].qty}／出荷先 架空卸 東日本センター`,{sign:"実施"});S.prog.F=true;tick(10)}
};

/* 照合（スキャン）判定 */
function judge(ctx,id){
  if(id==="HAND")return {type:"unissued"};
  const l=S.lots[id];
  if(ctx==="B"){
    if(l.kind!=="raw")return {type:"mismatch",expect:"移動指示の原料"};
    if(S.moved[l.key])return {type:"dup",expect:`${ITEMS[l.key].name} は読取済み（${S.moved[l.key]}）`};
    if(l.status==="判定前")return {type:"pending"};
    if(l.exp<"2026-11-10")return {type:"expired"};
    return {ok:true};
  }
  if(ctx==="W"){const k=S.wSel;
    if(S.moved[k]!==id)return {type:"mismatch",expect:`${ITEMS[k].name}（${S.moved[k]}）`};
    return {ok:true};
  }
  if(ctx==="C"){
    if(l.mo!==MO)return {type:"mismatch",expect:`製造指図 ${MO} の秤量済ラベル`};
    if(S.cScan[l.key])return {type:"dup",expect:"未読取の秤量済ラベル"};
    return {ok:true};
  }
  if(ctx==="E"){
    if(id===BATCH)return {ok:true};
    if(l.status==="記録確定前")return {type:"prev"};
    return {type:"mismatch",expect:`${BATCH} サンプル錠 100mg 素錠`};
  }
  if(ctx==="F"){
    if(id!=="P2611-01")return {type:"mismatch",expect:"P2611-01（出荷指示で指定されたロット）"};
    if(l.status!=="合格")return {type:"shipPending"};
    return {ok:true};
  }
}
const ERR={
  mismatch:{t:"ロット不一致",s:"指図と違う現品です",fix:"指図に書かれた品目・ロットのラベルを読み直してください。"},
  unissued:{t:"ラベル未発行",s:"システムが発行したラベルではありません",fix:"手書きや旧様式のラベルは使えません。この現品は作業を止め、責任者に連絡してください。"},
  prev:{t:"前工程が完了していません",s:"製剤記録が確定していないバルクです",fix:"前工程の主要製造記録が確定し、ラベルが発行されてから読み直してください。"},
  pending:{t:"品質判定前",s:"試験の判定が出ていない原料です",fix:"判定が「合格」の原料を読み直してください。判定前の原料は移動・使用できません。"},
  expired:{t:"使用期限切れ",s:"使用期限を過ぎた原料です",fix:"使用期限内の原料を読み直してください。この現品は隔離の手順に従ってください。"},
  dup:{t:"読取済み",s:"このラベルはすでに読み取っています",fix:"まだ読んでいないラベルを読み取ってください。"},
  shipPending:{t:"出荷判定前",s:"出荷判定が出ていない製品です",fix:"品質保証の出荷判定が「合格」になってから出荷登録できます。"}
};

/* 候補ラベル（実機ではカメラで読み取る） */
function candidates(ctx){
  const c=(id,hint)=>({id,hint});
  if(ctx==="B")return [c("R-2611-0031","err"),c("R-2610-0412","ok"),c("R-2411-0077","err"),c("R-2609-0188","ok"),c("R-2610-0255","ok"),c("R-2608-0102","ok")];
  if(ctx==="W")return KEYS.map(k=>c(S.moved[k],k===S.wSel?"ok":"err"));
  if(ctx==="C")return [c("HAND","err"),...KEYS.map(k=>c(S.weighed[k].wid,"ok")),c("W-2610-0233","err")];
  if(ctx==="E")return [c("B2611-02","err"),c("B2610-04","err"),c(BATCH,"ok")];
  if(ctx==="F")return [c("P2610-03","err"),c("P2611-01",S.released?"ok":"err")];
}
function used(ctx,id){
  if(ctx==="B")return Object.values(S.moved).includes(id);
  if(ctx==="W")return KEYS.some(k=>S.wScan[k]===id&&k!==S.wSel);
  if(ctx==="C")return Object.values(S.cScan).includes(id);
  if(ctx==="E")return S.eScan&&id===BATCH;
  if(ctx==="F")return S.fScan&&id==="P2611-01";
  return false;
}

/* ⑥ 規格チェック */
function dVal(k){const s=DSPEC.find(x=>x.k===k);return S.f["d_"+k]!=null?S.f["d_"+k]:s.def}
function outOf(s,v){const x=parseFloat(String(v).replace(/,/g,""));if(isNaN(x))return true;return (s.min!=null&&x<s.min)||(s.max!=null&&x>s.max)}
function dFails(){return DSPEC.filter(s=>outOf(s,dVal(s.k)))}
function eVal(k){const s=ESPEC.find(x=>x.k===k);return S.f["e_"+k]!=null?S.f["e_"+k]:s.def}
function eFails(){return ESPEC.filter(s=>s.min!=null&&outOf(s,eVal(s.k)))}
function eBalance(){
  const input=S.rec.D&&S.rec.D.vals?Number(S.rec.D.vals.qty):98500;
  const out=Number(eVal("boxes"))*100,def=Number(eVal("defect")),sam=Number(eVal("sample"));
  return {input,out,def,sam,diff:input-(out+def+sam)};
}

/* ===== ガイド（筋書き） ===== */
const GUIDE=[
  {id:"login",label:"ログイン",go:"login",need:null,
    point:"JIPROS本体と同じユーザーでログインします。現場端末はWebアプリで、APIを通じて本体と同じデータベースにつながります。"},
  {id:"A",label:"① 受入",go:"A1",need:"login",
    point:"受け入れた時点でロットが生まれ、原料ラベルが発行されます。現品と記録は、ここから一致しています。",
    tryit:"<b>外装の写真</b>を撮ってみてください（カメラが起動します）。受入後の状態が「品質判定前」になることも確認してください。次の工程で効いてきます。"},

function jumpTo(id){
  fresh();S.user="sato01";log("ログイン","sato01","JIPROS共通ユーザーで認証");tick(2);
  const order=["A","B","W","C","D","E","F"];
  const idx=id==="login"?-1:id==="A"?0:order.indexOf(id)>=0?order.indexOf(id):7;
  const run={
    A:()=>{core.receive();core.issueRaw()},
    B:()=>{S.screen="B2";["R-2610-0412","R-2609-0188","R-2610-0255","R-2608-0102"].forEach(core.scanMove);core.move()},
    W:()=>{S.screen="W1";KEYS.forEach(k=>{S.wSel=k;core.scanW(k,S.moved[k]);core.weigh(k)});S.wSel=null},
    C:()=>{S.screen="C1";KEYS.forEach(k=>core.scanC(S.weighed[k].wid));core.charge()},
    D:()=>{S.screen="D1";core.recD("suzuki02");core.issueBulk()},
    E:()=>{S.screen="E1";core.scanE();core.recE("suzuki02");core.issueProduct()},
    F:()=>{S.screen="F1";core.release();core.scanF();core.ship()}
  };
  for(let i=0;i<idx&&i<order.length;i++)run[order[i]]();
  S.f={};
  const g=GUIDE.find(x=>x.id===id);
  if(id==="login"){S.user=null;S.audit=[];S.screen="login"}
  else go(g.go);
  S.gopen=false;
}

function readPhoto(file,cb){
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const m=1024;const s=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(c.toDataURL("image/jpeg",0.8))};
  img.onerror=()=>{URL.revokeObjectURL(url);toast("画像を読み込めませんでした。もう一度撮影してください");render()};
  img.src=url;
}

}

SCR.audit=()=>{

  const list=S.audit.filter(e=>{
    if(F==="ng"&&e.res!=="NG")return false;
    if(F==="mod"&&!e.before)return false;
    if(F==="sign"&&!e.sign)return false;
    if(F==="label"&&e.action!=="ラベル発行")return false;
    if(q&&!(e.target+e.detail+e.user+e.action+e.term).includes(q))return false;return true;});
  const chips=[["all","すべて"],["ng","照合NG"],["mod","修正"],["sign","署名"],["label","ラベル発行"]].map(([k,t])=>`<button class="${F===k?"on":""}" data-a="af" data-k="${k}">${t}</button>`).join("");
  return {title:"監査証跡",sub:`${S.audit.length} 件（DB側で生成）`,back:"home",
  body:`<div class="search"><input id="au_q" data-f="auditQ" value="${esc(S.auditQ)}" placeholder="ロット・品目・作業者・操作で検索"><button class="btn sec" style="width:auto;padding:8px 12px;font-size:13px" data-a="aq">検索</button></div>

  <p class="eyebrow">${list.length} 件を表示（新しい順）</p>
  <div class="list">${list.map(e=>`<button class="ev ${e.res==="NG"?"ngv":e.before?"mod":""}" data-a="aopen" data-k="${e.id}">
    <span class="e1"><span class="num">${esc(e.at)}</span><span>${esc(e.user)}／${esc(e.term)}</span></span>
    <span class="e2">${esc(e.action)} ${e.res==="NG"?`<span class="chip ng">NG</span>`:""}${e.sign?`<span class="chip">署名：${esc(e.sign)}</span>`:""}</span>
    <span class="e3">${esc(e.target)}</span>
    ${S.auditOpen===e.id?`<span class="ex"><span class="stamp">内容</span><br>${esc(e.detail)}${e.before!=null?`<br><span class="stamp">修正前</span> ${esc(e.before)}　<span class="stamp">修正後</span> ${esc(e.after)}<br><span class="stamp">${e.photo?"差し替え理由":"修正理由"}</span> ${esc(e.reason)}`:""}${e.photo&&S.photos.find(p=>p.id===e.photo)?`<br><img src="${S.photos.find(p=>p.id===e.photo).data}" alt="写真 ${e.photo}" style="width:96px;height:96px;object-fit:cover;border-radius:6px;margin-top:6px">`:""}</span>`:""}
  </button>`).join("")||`<p class="info">該当する記録はありません。</p>`}</div>`,actions:""};
};

/* 入力中のフォーカスとスクロールを保ったまま画面を更新する */
function morph(from,to){
  if(from.nodeType!==to.nodeType||from.nodeName!==to.nodeName){from.replaceWith(to.cloneNode(true));return}
  if(from.nodeType===3||from.nodeType===8){if(from.nodeValue!==to.nodeValue)from.nodeValue=to.nodeValue;return}
  if(from.nodeType!==1)return;
  for(const a of [...from.attributes])if(!to.hasAttribute(a.name))from.removeAttribute(a.name);
  for(const a of [...to.attributes])if(from.getAttribute(a.name)!==a.value)from.setAttribute(a.name,a.value);
  const tag=from.tagName;
  if(tag==="INPUT"){
    if(from.type==="checkbox")from.checked=to.hasAttribute("checked");
    else if(from!==document.activeElement){const v=to.getAttribute("value")||"";if(from.value!==v)from.value=v}
    return;
  }
  if(tag==="TEXTAREA"){if(from!==document.activeElement&&from.value!==to.textContent)from.value=to.textContent;return}
  const fc=[...from.childNodes],tc=[...to.childNodes];
  for(let i=0;i<tc.length;i++){if(i<fc.length)morph(fc[i],tc[i]);else from.appendChild(tc[i].cloneNode(true))}
  for(let i=fc.length-1;i>=tc.length;i--)from.removeChild(fc[i]);
  if(tag==="SELECT"){const so=to.querySelector("option[selected]");from.value=so?(so.getAttribute("value")!=null?so.getAttribute("value"):so.textContent):(from.options[0]?from.options[0].value:"")}
}

  lastScreen=S.screen;
}
